services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-depotflow}
      POSTGRES_USER: ${POSTGRES_USER:-depotflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depotflow}
    ports:
      - "5432:5432"
    volumes:
      - depotflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  depotflow-postgres:
