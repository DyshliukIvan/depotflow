services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-depotflow}
      POSTGRES_USER: ${POSTGRES_USER:-depotflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depotflow}
    ports:
      - "5432:5432"
    volumes:
      - depotflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: depotflow:0.1.0
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/depotflow
      DB_USERNAME: depotflow
      DB_PASSWORD: depotflow
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  depotflow-postgres:
