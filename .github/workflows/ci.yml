name: CI
on: ["push", "pull_request"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: bash ./gradlew test

      - name: Build aplication
        run: bash ./gradlew bootJar

      - name: Build Docker Image
        run: docker build -t depotflow:ci .

      - name: Save Jar
        run: actions/upload-artifact@7
        with:
          name: depotflow-jar
          path: build/libs/depotflow-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

